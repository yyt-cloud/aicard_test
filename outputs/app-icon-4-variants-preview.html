<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App 桌面图标 · 4 个变体</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.page{max-width:1180px;margin:auto;padding:56px 28px}.head{margin-bottom:32px}.head h1{margin:0;font-size:34px;letter-spacing:-1px}.head p{margin:9px 0 0;color:#76767d;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.item{padding:18px;border:1px solid #e6e6eb;border-radius:22px;background:#fff;box-shadow:0 12px 32px rgba(30,30,45,.07)}.item img{display:block;width:100%;border-radius:22%;box-shadow:0 12px 24px rgba(49,40,92,.16)}.item h2{margin:18px 0 5px;font-size:15px}.item p{margin:0;color:#808087;font-size:11px;line-height:1.5}.sizes{display:flex;align-items:end;gap:12px;margin-top:15px}.sizes img{border-radius:22%;box-shadow:none}.sizes img:nth-child(1){width:48px}.sizes img:nth-child(2){width:32px}.sizes img:nth-child(3){width:20px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style></head><body><main class="page"><header class="head"><h1>灵感岛屿 · 桌面图标</h1><p>四个方向均保留胶囊眼睛与蓝紫粉品牌色，并针对 48 / 32 / 20 px 小尺寸辨识优化。</p></header><section class="grid">
