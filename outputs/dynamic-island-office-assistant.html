<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办公 AI 灵动岛</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}.stage{width:min(920px,calc(100vw - 32px));padding:46px;border:1px solid #e5e5ea;border-radius:32px;background:#fff;box-shadow:0 28px 70px rgba(22,22,32,.11)}h1{margin:0;text-align:center;font-size:30px;letter-spacing:-.8px}p.lead{margin:8px 0 34px;text-align:center;color:#818188;font-size:13px}.phone{position:relative;width:min(390px,100%);height:720px;margin:auto;overflow:hidden;border:6px solid #222226;border-radius:48px;background:linear-gradient(180deg,#fafafd,#f2f1f7);box-shadow:0 24px 48px rgba(25,25,38,.2)}.content{padding:76px 22px}.content h2{margin:0 0 6px;font-size:28px;letter-spacing:-.8px}.content p{margin:0;color:#898991;font-size:12px}.cards{display:grid;gap:10px;margin-top:28px}.card{padding:16px;border:1px solid #e7e7ec;border-radius:16px;background:#fff}.card span{color:#8d8d95;font-size:9px}.card b{display:block;margin-top:7px;font-size:13px}.island{position:absolute;z-index:10;top:13px;left:50%;width:116px;height:32px;transform:translateX(-50%);overflow:hidden;border:0;border-radius:999px;background:#050507;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:width .58s cubic-bezier(.22,1,.36,1),height .58s cubic-bezier(.22,1,.36,1),border-radius .58s cubic-bezier(.22,1,.36,1),box-shadow .3s}.island:hover{box-shadow:0 7px 20px rgba(0,0,0,.22)}.island.open{width:326px;height:116px;border-radius:32px}.compact{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .18s}.island.open .compact{opacity:0}.mini-eye{width:4px;height:12px;border-radius:5px;background:#fff;transform:rotate(-6deg)}.mini-eye:nth-child(2){width:3px}.expanded{position:absolute;inset:0;padding:17px 18px;opacity:0;transform:translateY(7px);transition:opacity .28s .16s,transform .38s .14s}.island.open .expanded{opacity:1;transform:none}.top{display:flex;align-items:center;gap:12px}.face{position:relative;width:42px;height:42px;flex:0 0 auto;border:1px solid #29292e;border-radius:50%;background:linear-gradient(145deg,#394ff2,#8a56d3 58%,#df5e9d)}.face:before,.face:after{content:"";position:absolute;top:12px;width:5px;height:16px;border-radius:6px;background:#fff;transform:rotate(-7deg)}.face:before{left:12px}.face:after{right:12px;width:4px}.copy{min-width:0;text-align:left}.copy b{display:block;font-size:12px;font-weight:600}.copy span{display:block;margin-top:3px;color:#94949c;font-size:9px;white-space:nowrap}.timer{margin-left:auto;color:#77777f;font-size:9px;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.actions button{height:27px;border:1px solid #29292f;border-radius:9px;background:#151519;color:#dcdce1;font-size:8px;cursor:pointer}.actions button:hover{background:#212127}.actions .primary{border-color:#5550ad;background:#35316f;color:#fff}.pulse{position:absolute;left:50%;bottom:8px;width:100px;height:2px;transform:translateX(-50%);overflow:hidden;border-radius:2px;background:#27272c}.pulse i{display:block;width:35%;height:100%;border-radius:inherit;background:#8884ff;animation:listen 1.5s ease-in-out infinite}@keyframes listen{50%{transform:translateX(185%)}}.hint{margin:22px 0 0;text-align:center;color:#85858c;font-size:11px}.hint kbd{padding:3px 6px;border:1px solid #dddde2;border-radius:6px;background:#fafafa;font:10px inherit}@media(max-width:600px){.stage{padding:20px 10px;border:0;border-radius:0}.phone{height:690px}}
</style></head><body><main class="stage"><h1>办公 AI 灵动岛</h1><p class="lead">点击展开；聚合会议、任务与 AI 操作，不打断当前工作。</p><section class="phone"><button class="island" id="island" aria-expanded="false"><span class="compact"><i class="mini-eye"></i><i class="mini-eye"></i></span><span class="expanded"><span class="top"><i class="face"></i><span class="copy"><b id="title">产品评审还有 12 分钟</b><span id="sub">议程已生成 · 2 项材料待补充</span></span><span class="timer">15:30</span></span><span class="actions"><button data-state="meeting" class="primary">开始准备</button><button data-state="listen">记录会议</button><button data-state="task">查看任务</button></span><span class="pulse"><i></i></span></span></button><div class="content"><h2>今天</h2><p>4 项待办 · 2 场会议 · 1 项待回复</p><div class="cards"><div class="card"><span>下一场会议 · 15:30</span><b>语音办公工作台评审</b></div><div class="card"><span>高优先级 · 17:00 截止</span><b>完成首页高保真方案</b></div><div class="card"><span>待回复</span><b>客户对交互方案的反馈</b></div></div></div></section><p class="hint">点击灵动岛，或按 <kbd>Space</kbd> 展开 / 收起</p></main><script>
const island=document.getElementById('island'),title=document.getElementById('title'),sub=document.getElementById('sub');function toggle(force){const open=force??!island.classList.contains('open');island.classList.toggle('open',open);island.setAttribute('aria-expanded',open)}island.addEventListener('click',e=>{if(e.target.closest('.actions button'))return;toggle()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();toggle()}});document.querySelectorAll('.actions button').forEach(b=>b.onclick=e=>{e.stopPropagation();const states={meeting:['正在准备产品评审','已汇总上次纪要与待确认问题'],listen:['正在记录会议','实时提炼结论、争议点和行动项'],task:['今日还有 4 项任务','最优先：完成首页高保真方案']};[title.textContent,sub.textContent]=states[b.dataset.state];document.querySelectorAll('.actions button').forEach(x=>x.classList.toggle('primary',x===b));toggle(true)});
</script></body></html>
