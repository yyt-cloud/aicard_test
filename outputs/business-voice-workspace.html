<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Desk</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#202231}.phone{position:relative;width:min(402px,100%);height:min(874px,calc(100vh - 56px));overflow:hidden;border:7px solid #1d1e25;border-radius:48px;background:#f4f5f8;box-shadow:0 28px 70px rgba(28,31,43,.22)}.island{position:absolute;z-index:20;top:12px;left:50%;width:106px;height:27px;border-radius:20px;background:#090a0d;transform:translateX(-50%)}.scroll{height:100%;overflow:auto;padding:58px 18px 220px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.head{position:sticky;z-index:8;top:0;margin:0 -18px;padding:8px 20px 14px;background:rgba(244,245,248,.94);backdrop-filter:blur(18px)}h1{margin:0;font-size:28px;letter-spacing:-.04em}.sub{margin-top:5px;color:#808491;font-size:11px}.status{display:flex;gap:7px;margin:15px 0}.pill{padding:6px 10px;border:1px solid #e2e3e9;border-radius:999px;background:#fff;color:#656a78;font-size:10px}.pill.live{color:#375ec9;background:#edf2ff;border-color:#dce6ff}.section-title{margin:19px 2px 10px;font-size:11px;color:#898d98;letter-spacing:.05em}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{min-height:78px;padding:13px;border:1px solid rgba(255,255,255,.9);border-radius:17px;background:rgba(255,255,255,.76);box-shadow:0 8px 24px rgba(49,54,78,.07);text-align:left;color:#303341}.quick b{display:block;margin-bottom:6px;font-size:13px}.quick span{font-size:10px;color:#858997}.items{display:grid;gap:10px}.item{padding:14px;border:1px solid #e8e9ed;border-radius:16px;background:#fff;box-shadow:0 8px 22px rgba(46,51,73,.05)}.item-top{display:flex;justify-content:space-between;gap:10px}.item b{font-size:13px}.type{font-size:9px;color:#5966a7}.item p{margin:8px 0 0;color:#717683;font-size:10px;line-height:1.55}.voice-bg{position:absolute;z-index:9;inset:auto 0 0;height:0;opacity:0;background:radial-gradient(ellipse at 5% 100%,#3048ff,transparent 67%),radial-gradient(ellipse at 100% 100%,#e84f9c,transparent 70%),#7963d5;transition:.55s cubic-bezier(.2,.8,.2,1)}.voice-zone{position:absolute;z-index:12;inset:auto 0 0;height:210px;pointer-events:none}.orb{position:absolute;left:50%;bottom:-616px;width:680px;height:680px;border:0;border-radius:50%;transform:translateX(-50%);pointer-events:auto;background:radial-gradient(circle at 18% 12%,#3048ff,transparent 42%),radial-gradient(circle at 78% 42%,#8c4cdb,transparent 58%),radial-gradient(circle at 52% 96%,#e93a91,#f27daf 72%,#b45acf);transition:.55s cubic-bezier(.2,.8,.2,1)}.eyes{position:absolute;top:18px;left:50%;display:flex;gap:12px;transform:translateX(-50%)}.eye{width:5px;height:15px;border-radius:99px;background:#fff;animation:blink 4s infinite}.wavebox,.listening{position:absolute;left:50%;opacity:0;transform:translateX(-50%) translateY(8px);transition:.35s}.listening{bottom:102px;color:#fff;font-size:14px}.wavebox{bottom:38px;width:164px;height:44px;padding:9px 12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.08)}canvas{width:100%;height:100%}.active .voice-bg{height:50%;opacity:1}.active .voice-zone{height:50%}.active .orb{top:38px;bottom:auto;width:112px;height:112px;background:transparent;border:1px solid rgba(255,255,255,.65)}.active .eyes{top:46px;transform:translateX(-50%) scale(2.2)}.active .wavebox,.active .listening{opacity:1;transform:translateX(-50%)}.sheet{position:absolute;z-index:30;left:16px;right:16px;bottom:150px;padding:15px;border:1px solid rgba(255,255,255,.65);border-radius:18px;background:rgba(255,255,255,.86);box-shadow:0 18px 48px rgba(30,29,58,.22);backdrop-filter:blur(20px);opacity:0;pointer-events:none;transform:translateY(8px);transition:.25s}.sheet.show{opacity:1;pointer-events:auto;transform:none}.sheet b{font-size:13px}.sheet p{margin:7px 0 12px;color:#686c78;font-size:11px;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{padding:7px 10px;border:0;border-radius:999px;background:#eef0f5;color:#525766;font-size:10px}.actions .primary{background:#625dc4;color:#fff}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
</style></head><body><main class="phone" id="app"><div class="island"></div><section class="scroll"><header class="head"><h1>Voice Desk</h1><div class="sub">说完即整理，确认后再执行</div></header><div class="status"><span class="pill live">AI 助理在线</span><span class="pill">今天 4 项</span></div><div class="section-title">快捷工作流</div><div class="quick"><button data-demo="meeting"><b>会议总结</b><span>纪要、决策、待办</span></button><button data-demo="memo"><b>语音备忘</b><span>快速整理并归档</span></button><button data-demo="task"><b>提取任务</b><span>负责人和截止时间</span></button><button data-demo="tool"><b>调用工具</b><span>邮件、日历、任务系统</span></button></div><div class="section-title">最近产出</div><div class="items" id="items"><article class="item"><div class="item-top"><b>产品周会纪要</b><span class="type">MEETING</span></div><p>确认新版首页周五评审；设计稿由 Hillary 明天下午前补齐。</p></article><article class="item"><div class="item-top"><b>客户回访备忘</b><span class="type">MEMO</span></div><p>客户关注权限管理与导出能力，下次演示需要准备真实业务数据。</p></article></div></section><div class="voice-bg"></div><section class="voice-zone"><button class="orb" id="voice" aria-label="开始录音"><span class="eyes"><i class="eye"></i><i class="eye"></i></span></button><div class="listening">正在识别工作意图…</div><div class="wavebox"><canvas id="wave"></canvas></div></section><section class="sheet" id="sheet"><b id="sheetTitle"></b><p id="sheetBody"></p><div class="actions" id="actions"></div></section></main>
<script>
const app=document.getElementById('app'),voice=document.getElementById('voice'),sheet=document.getElementById('sheet'),title=document.getElementById('sheetTitle'),body=document.getElementById('sheetBody'),actions=document.getElementById('actions'),items=document.getElementById('items'),API='http://127.0.0.1:8010';let recording=false,recorder,chunks=[],stream;
const flows={meeting:{title:'会议内容已整理',body:'识别到 2 项决策、3 项待办和 1 项风险。请选择下一步。',actions:['查看纪要','创建任务','发送摘要']},memo:{title:'备忘已整理',body:'已提炼主题、关键背景和后续提醒。',actions:['保存备忘','设为提醒']},task:{title:'已提取行动项',body:'确认负责人和截止时间后，可以同步到任务系统。',actions:['确认任务','编辑信息']},tool:{title:'准备调用工具',body:'即将创建明天下午 3 点的项目复盘会议。执行前需要确认。',actions:['确认执行','取消']}};
function show(data){title.textContent=data.title;body.textContent=data.body;actions.innerHTML='';(data.actions||['确认','取消']).forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i===0?'primary':'';b.onclick=()=>{sheet.classList.remove('show');if(i===0&&data.output){const el=document.createElement('article');el.className='item';el.innerHTML='<div class="item-top"><b>'+data.output.title+'</b><span class="type">'+data.output.type+'</span></div><p>'+data.output.summary+'</p>';items.prepend(el)}};actions.appendChild(b)});sheet.classList.add('show')}
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>show(flows[b.dataset.demo]));
voice.onclick=async()=>{if(recording){recording=false;recorder.stop();app.classList.remove('active');return}try{stream=stream&&stream.active?stream:await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=async()=>{try{const form=new FormData;form.append('file',new Blob(chunks,{type:recorder.mimeType}),'voice.webm');const r=await fetch(API+'/api/voice',{method:'POST',body:form}),data=await r.json();if(!r.ok)throw Error(data.detail);show(data)}catch(e){show({title:'连接提示',body:e.message||'请先启动商务语音后端。',actions:['知道了']})}};recorder.start();recording=true;app.classList.add('active')}catch(e){show({title:'无法录音',body:'请允许浏览器使用麦克风。',actions:['知道了']})}};
const c=document.getElementById('wave'),ctx=c.getContext('2d');function draw(t){const w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2;ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<25;i++){const d=Math.abs(i-12),v=8+(Math.sin(t/180-d*.55)+1)*15*(1-d/18);ctx.beginPath();ctx.roundRect(i*w/25+3,h/2-v/2,4,v,3);ctx.fill()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
