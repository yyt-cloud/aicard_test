services:
  - type: web
    name: voice-island-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BAIDU_API_KEY
        sync: false
      - key: BAIDU_SECRET_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: BAIDU_DEV_PID
        value: "1537"
